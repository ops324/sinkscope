name: CI

# 誠実性フレームワーク(docs/SPEC.md §5)を支えるテスト群 ―― 生スコアの非公開・
# tier並び順のpriority_index非依存化・p値/相関の単一情報源化などのガードレール
# (backend/*/tests.py、独立敵対的監査PR #6〜#9で追加/強化) ―― は、これまで
# ローカルで手動実行するしかなく、回帰しても気づけなかった。本ワークフローは
# それを全PR・全pushで強制する。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # README「開発環境セットアップ」と同一の手順(cp .env.example .env →
      # docker compose up --build)。CIを別経路にすると手順同士がdriftするため、
      # 実際にコントリビューターが踏む手順をそのまま踏む。
      - name: Prepare .env
        run: cp .env.example .env

      - name: Build backend image
        run: docker compose build backend

      # `docker compose run`はdepends_on(dbのservice_healthy条件)を解決してから
      # 単発コンテナを実行し、コンテナの終了コードをそのまま返す
      # (`up`と違い、テストの成否がジョブの成否に正しく伝播する)。
      - name: Run Django test suite
        run: docker compose run --rm backend python manage.py test --verbosity=2

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend db

      - name: Tear down
        if: always()
        run: docker compose down -v

  # docs/ASSESSMENT.mdの実測値(p値・Moran's I・ρ)が、コミット済みgolden snapshot
  # (docs/SNAPSHOT.md参照)から実際に再現できることを継続的に検証する。testジョブ
  # とは別のCIランナー(VM)で動くため、docker-compose.ymlの既定ポート(5432/8000)を
  # そのまま使ってよい(scripts/reproduce.shがローカルで使うポートずらしは、開発中の
  # `docker compose up`と共存するためのものでCI環境では不要)。
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build backend image
        run: docker compose build backend

      - name: Migrate
        run: docker compose run --rm backend python manage.py migrate

      - name: Reproduce ASSESSMENT.md metrics from golden snapshot
        run: docker compose run --rm backend python manage.py reproduce_assessment

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend db

      - name: Tear down
        if: always()
        run: docker compose down -v

  # 単一URL配信(D7): シェア用の静的サイトが読むコミット済みJSON
  # (frontend/public/data/*.json)が、golden snapshotから再生成した結果と一致することを
  # 継続検証する。分析ロジックやsnapshotを変えたのに`make static`で焼き直し忘れると落ちる
  # (golden snapshot再現ハーネスと同じ「主張を機械で強制」の思想)。時刻/pkだけの差では
  # 落とさない(export_static --check が created_at/run_id/run.id を除外して意味的に比較)。
  # reproduce_assessmentは既存データがあると失敗するため相乗りできず、独立ジョブにする。
  static-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --check はコミット済み frontend/public/data/*.json(Git LFS)と再生成結果を
          # 比較するため、LFSポインタではなく実体を取得する必要がある。
          lfs: true

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build backend image
        run: docker compose build backend

      - name: Seed demo DB from golden snapshot
        run: docker compose run --rm backend sh -c "python manage.py migrate && python manage.py seed_demo --force"

      - name: Check committed static JSON matches a fresh export
        run: |
          docker compose run --rm -v "$PWD/frontend/public/data:/committed:ro" backend \
            python manage.py export_static --check --out /committed

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend db

      - name: Tear down
        if: always()
        run: docker compose down -v
