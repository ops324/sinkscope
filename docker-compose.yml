name: sinkscope

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-sinkscope}
      POSTGRES_USER: ${DB_USER:-sinkscope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinkscope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DB_HOST_PORTはscripts/reproduce.shが専用の使い捨て環境(別Compose project名
    # "sinkscope-reproduce")を、開発中のdb(5432番使用中)と共存させるために使う。
    # 通常の開発では未設定のままでよく、その場合は既定の5432。
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinkscope}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./data:/data
    # BACKEND_HOST_PORTの理由はdbサービスのDB_HOST_PORTと同じ
    # (scripts/reproduce.sh参照)。
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # postgis初回起動はinitdbのため一瞬再起動が入り、db側healthcheck通過直後でも
    # backendの最初の接続が拒否されることがある。自己修復のためunless-stoppedにする。
    restart: unless-stopped

volumes:
  pgdata:
